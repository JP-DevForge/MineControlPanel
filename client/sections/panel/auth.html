<section class="auth-page">

  <div class="auth-card">

    <h1>MineControlPanel</h1>

    <p id="auth-description">
      Cargando...
    </p>

    <form id="auth-form">

      <label for="auth-password">
        Contraseña
      </label>

      <input
        id="auth-password"
        type="password"
        autocomplete="current-password"
        placeholder="Introduce la contraseña"
        required
      >

      <button
        type="submit"
        class="primary-button"
      >
        Continuar
      </button>

    </form>

    <p id="auth-message"></p>

  </div>

</section>
