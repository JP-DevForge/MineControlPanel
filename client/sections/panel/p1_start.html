<section class="status-page">

  <article class="status-card">
    <h2>Servidor</h2>

    <div class="status-grid">
      <div>
        <span>IP</span>
        <strong id="status-server-ip">Cargando...</strong>
      </div>

      <div>
        <span>Puerto</span>
        <strong id="status-server-port">Cargando...</strong>
      </div>

      <div class="status-version-box">
        <span>Versión</span>

        <div class="version-row">
          <strong id="status-server-version">Cargando...</strong>

          <button id="open-version-list" type="button">
            Actualizar
          </button>
        </div>

        <select id="version-list" class="hidden">
          <option value="">Cargando versiones...</option>
        </select>

        <button id="apply-version" class="hidden" type="button">
          Aplicar versión
        </button>

        <p id="version-message"></p>
      </div>
    </div>
  </article>

  <article class="status-card">
    <h2>Hardware</h2>

    <div class="status-grid">
      <div>
        <span>RAM</span>
        <strong id="status-system-ram">Cargando...</strong>
      </div>

      <div>
        <span>Temperatura</span>
        <strong id="status-system-temp">Cargando...</strong>
      </div>
    </div>
  </article>

</section>
