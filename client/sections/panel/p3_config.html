<main>


  <section id="config-properties" class="config-panel active">
    <section id="config-options" class="options">
      <p class="empty-message">Cargando configuración...</p>
    </section>

    <button id="save-config" class="primary-button">
      Guardar configuración
    </button>
  </section>


<section id="config-backups" class="config-panel">

  <div class="backup-container">

    <div class="backup-header">

      <div>
        <h2>Ruta de backups</h2>

        <p id="backup-path">
          No configurada
        </p>
      </div>

      <div class="backup-storage">
        <span id="backup-size">
          0 MB
        </span>

        <button id="edit-backup-path">
          Editar
        </button>
      </div>

    </div>

    <div id="backup-list">

      <p class="empty-message">
        No hay backups
      </p>

    </div>

    <div class="backup-settings">

      <div class="backup-setting">

        <label class="switch">
          <input
            id="automatic-backups"
            type="checkbox"
          >
          <span class="slider"></span>
        </label>

        <span>
          Backups automáticos cada
        </span>

        <input
          id="backup-interval"
          type="number"
          min="1"
          value="60"
          class="number"
        >

        <span>
          minutos
        </span>

        <span>
          almacenar últimos
        </span>

        <input
          id="backup-limit"
          type="number"
          min="1"
          value="10"
          class="number"
        >

        <span>
          backups automáticos
        </span>

      </div>

      <div class="backup-footer">

        <div class="backup-setting">

          <label class="switch">
            <input
              id="backup-on-start"
              type="checkbox"
            >
            <span class="slider"></span>
          </label>

          <span>
            Backup al iniciar
          </span>

        </div>

        <button id="create-backup">
          Crear backup ahora
        </button>

      </div>

    </div>

  </div>

</section>
</main>
