<main>
  <video autoplay muted loop class="panorama">
    <source src="../../img/Panoramico-av1-lossless.webm" type="video/webm">
  </video>

  <section class="config-tabs">
    <button class="config-tab active" data-config-tab="properties">
      Server properties
    </button>

    <button class="config-tab" data-config-tab="commands">
      Comandos automáticos
    </button>

    <button class="config-tab" data-config-tab="backups">
      Backups
    </button>
  </section>

  <section id="config-properties" class="config-panel active">
    <section id="config-options" class="options">
      <p class="empty-message">Cargando configuración...</p>
    </section>

    <button id="save-config" class="primary-button">
      Guardar configuración
    </button>
  </section>

  <section id="config-commands" class="config-panel">
    <section class="config-box">
      <h2>Comandos automáticos</h2>

      <p class="empty-message">
        Aquí irán los comandos programados del servidor.
      </p>
    </section>
  </section>

  <section id="config-backups" class="config-panel">
    <section class="config-box">
      <h2>Backups</h2>

      <p class="empty-message">
        Aquí irá la configuración de copias de seguridad.
      </p>
    </section>
  </section>
</main>
