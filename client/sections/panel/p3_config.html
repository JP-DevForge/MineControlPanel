<main>
    <video autoplay muted loop class="panorama">
        <source src="https://archive.org/download/Panoramico/Panoramico.mp4" type="video/mp4">
    </video>

    <section class="options">

        <div class="option">
            <p>Gamemode:</p>
            <select>
                <option>Supervivencia</option>
                <option>Creativo</option>
                <option>Aventura</option>
                <option>Espectdor</option>
            </select>
        </div>

        <div class="option">
            <p>Dificultad:</p>
            <select>
                <option>Pacífico</option>
                <option>Fácil</option>
                <option>Normal</option>
                <option>Difícil</option>
            </select>
        </div>

        <div class="option">
            <p>Jugadores maximos</p>
            <input type="number" min="1" value="20" class="number">
        </div>

        <div class="option">
            <p>Permitir Craqueado</p>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="option">
            <p>volar</p>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="option">
            <p>Whitelist</p>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="option">
            <p>Permitir trucos</p>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="option">
            <p>Hardcore</p>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="option">
            <p>Distancia de Renderizado</p>
            <input type="number" min="5" max="32" value="10" class="number">
        </div>

    </section>
</main>
