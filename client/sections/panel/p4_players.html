<section class="players-page">
<header class="players-header">
  <div>
    <div class="players-title-row">
      <h2>Jugadores</h2>

      <button id="open-whitelist" type="button">
        Whitelist
      </button>

      <label class="switch">
        <input id="whitelist-enabled" type="checkbox">
        <span class="slider"></span>
      </label>
    </div>

    <p id="players-summary">Cargando jugadores...</p>
  </div>

  <input
    id="players-filter"
    type="text"
    placeholder="Filtrar jugador..."
    autocomplete="off"
  >
</header>

  <div class="players-table-wrap">
    <table class="players-table">
      <thead>
        <tr>
          <th>Estado</th>
          <th>Jugador</th>
          <th>Modo</th>
          <th>Rango</th>
          <th>Mundo</th>
          <th>Vida</th>
          <th>Comida</th>
          <th>Coordenadas</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody id="players-tbody">
        <tr>
          <td colspan="9">Cargando...</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
